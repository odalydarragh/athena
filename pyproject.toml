[project]
name = "documdr"
version = "0.1.0"
description = "Local-first compiler for draft IEC 62304 traceability records. Not a conformity assessment."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "DocuMDR contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
documdr = "documdr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
